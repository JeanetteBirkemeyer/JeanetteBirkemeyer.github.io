<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jeanette Birkemeyer – Portfolio</title>
<meta name="description" content="Portfolio von Jeanette Birkemeyer: Grafikdesign und Animation.">
<meta name="theme-color" content="#423E37">
<link rel="preload" as="image" href="media/img/Homepage_Vintage_TVs.webp" type="image/webp">
<style>
@font-face{font-family:"Reddit Mono";src:url(media/font/RedditMono.woff2) format("woff2");font-weight:200 900;font-display:swap}
:root{
 --gold:#F4B146;--ink:#423E37;--teal:#558C8C;--rust:#C65231;--mint:#EDFFEB;
 --bg:#2b2824;--mu:#b9c4b6;
 --f:"Reddit Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
 --out:cubic-bezier(.23,1,.32,1);--io:cubic-bezier(.77,0,.175,1);
 --tab:8.5rem
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--mint);font:15px/1.65 var(--f);overflow:hidden}
@media(hover:hover) and (pointer:fine){body.rc,body.rc *{cursor:none!important}}
h1,h2,h3{font-weight:700;margin:0}
[hidden]{display:none!important}
button{font:inherit;color:inherit}

/* ---------- Bühne ---------- */
#stage{position:fixed;left:0;top:0;transform-origin:0 0;will-change:transform}
#stage.anim{transition:transform .72s var(--io)}
#stage picture,#stage picture img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.hs{position:absolute;border:0;padding:0;margin:0;background:transparent;cursor:pointer;transition:filter .2s ease;-webkit-tap-highlight-color:transparent}
.hs .scr{position:absolute;inset:0;overflow:hidden;background:#000}
.hs .scr video,.hs .scr img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
@media(hover:hover) and (pointer:fine){.hs.tv:hover{filter:drop-shadow(0 0 6px var(--gold)) drop-shadow(0 0 18px #f4b14688)}.hs.poster:hover{box-shadow:0 0 0 2px var(--gold),0 0 12px 2px var(--gold),0 0 32px 6px #f4b14688}}
.hs:focus-visible{outline:none;filter:drop-shadow(0 0 0 var(--gold)) drop-shadow(0 0 3px var(--gold)) drop-shadow(0 0 14px var(--gold))}
.hs.poster{background:transparent;transition:box-shadow .2s ease}
.hs.poster:focus-visible{filter:none;box-shadow:0 0 0 2px var(--gold),0 0 14px 2px var(--gold)}
@media(pointer:coarse){.hs{animation:pl 2.6s ease-in-out infinite}}
@keyframes pl{50%{filter:drop-shadow(0 0 10px #f4b146aa)}}
@keyframes plp{50%{box-shadow:0 0 14px 3px #f4b146aa}}
@media(pointer:coarse){.hs.poster{animation-name:plp}}
body.dbg .hs{outline:1px dashed #0f0}

/* Unschärfe um das geöffnete Objekt (mit Loch) */
#veil{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;-webkit-backdrop-filter:blur(10px) brightness(.5);backdrop-filter:blur(10px) brightness(.5);transition:opacity .35s ease}
body.open #veil{opacity:1;transition:opacity .45s ease .3s}

/* ---------- Kopfzeile ---------- */
#bar{position:fixed;inset:0 0 auto 0;z-index:30;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;padding:max(14px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) 40px max(22px,env(safe-area-inset-left));background:linear-gradient(#2b2824e6,#2b282400);pointer-events:none;transition:opacity .2s ease,transform .25s var(--out)}
#bar>*{pointer-events:auto}
#bar h1{font-size:clamp(17px,2.2vw,26px);letter-spacing:.04em;line-height:1.1}
#bar small{display:block;color:var(--gold);letter-spacing:.3em;font-size:11px;margin-top:5px}
#bar nav{display:flex;gap:10px;flex-wrap:wrap}
body.open #bar,body.open #foot{opacity:0;transform:translateY(-10px);pointer-events:none}
body.open #bar>*{pointer-events:none}

/* Retro-Buttons (3D-Kante wie Windows 95) in den Farben des Farbschemas */
.key{--w95:"Tahoma","MS Sans Serif","Microsoft Sans Serif","Segoe UI","Geneva",Verdana,sans-serif;
 --face:#4d483f;--hi:#7a7266;--lt:#5f594f;--sh:#2c2924;--dk:#191714;
 font:400 12px/1 var(--w95);color:var(--mint);background:var(--face);border:0;border-radius:0;padding:7px 14px;min-height:26px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;cursor:pointer;letter-spacing:0;text-transform:none;
 box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--sh),inset 2px 2px var(--lt)}
@media(hover:hover) and (pointer:fine){.key:hover{color:var(--gold)}}
.key:active,.key.on{box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--dk),inset -2px -2px var(--lt),inset 2px 2px var(--sh);padding:8px 13px 6px 15px}
.key.ac{--face:#C65231;--hi:#e88a6c;--lt:#d56a49;--sh:#8f3a20;--dk:#5a2412;color:var(--mint)}
@media(hover:hover) and (pointer:fine){.key.ac:hover{color:#fff;--face:#d05b39}}
.key svg{display:block;flex:none}
.key.ic{min-width:44px;padding:6px 10px}
.key.ic:active{padding:7px 9px 5px 11px}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.key:focus-visible{outline:1px dotted var(--gold);outline-offset:-5px}
/* Menü-Button größer, leichter zu treffen */
#x,.ov .close{font-size:15px;padding:12px 20px 12px 16px;min-height:46px;gap:10px}
#x:active,.ov .close:active{padding:13px 19px 11px 17px}
#x svg,.ov .close svg{width:16px;height:16px}
#foot{position:fixed;left:max(22px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));z-index:30;font-size:11px;color:var(--mint);letter-spacing:.08em;text-shadow:0 1px 3px #000;transition:opacity .2s ease,transform .25s var(--out)}
#foot button{all:unset;cursor:pointer;text-decoration:underline}
#foot button:focus-visible{outline:2px solid var(--gold)}
#foot small{display:block;opacity:.7;font-size:9px;margin-top:2px}

/* ---------- Cursor ---------- */
#remote{position:fixed;left:0;top:0;z-index:300;pointer-events:none;will-change:transform;display:none}
body.rc #remote{display:block}
#remote canvas{display:block;width:260px;height:260px;filter:drop-shadow(0 10px 8px #0009)}
#remote img{display:block;width:84px;transition:transform .12s var(--out)}
#remote img.press{transform:scale(.92)}
#ir{position:fixed;left:0;top:0;z-index:299;width:12px;height:12px;margin:-6px;border-radius:50%;border:2px solid var(--gold);opacity:0;pointer-events:none}
#ir.go{animation:ir .45s var(--out)}
@keyframes ir{from{opacity:1;transform:var(--t) scale(.4)}to{opacity:0;transform:var(--t) scale(3.5)}}
#osd{position:fixed;left:0;top:0;z-index:298;pointer-events:none;display:none;background:var(--ink);color:var(--gold);border:1px solid var(--gold);border-radius:3px;padding:5px 10px;font-size:12px;letter-spacing:.08em;white-space:nowrap;text-transform:uppercase}
body.rc #osd.on{display:block}

/* ---------- Projekt-Ansicht ---------- */
#view{position:fixed;inset:0;z-index:40}
#view .sc{position:absolute;inset:0;z-index:2;overflow-y:auto;overscroll-behavior:none;outline:none;pointer-events:none}
#view .tr,#view .st{pointer-events:none}
#panel{pointer-events:auto}
#view .tr{height:170vh}
#view .st{position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden}
#x{position:fixed;left:max(18px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));z-index:60}
#player{position:absolute;z-index:1;background:#000;overflow:hidden;opacity:0}
#player.on{opacity:1}
#player video,#player img{width:100%;height:100%;object-fit:contain;display:block;background:#000}
#player.pic{background:#1d1b18;cursor:zoom-in}
/* Steuerung unter dem TV: Retro-Fenster in den Farben des Farbschemas */
#ctl{position:absolute;z-index:1;display:grid;gap:6px;padding:7px;background:var(--ink);font:12px/1 "Tahoma","MS Sans Serif",Verdana,sans-serif;color:var(--mint);box-shadow:inset -1px -1px #191714,inset 1px 1px #7a7266,inset -2px -2px #2c2924,inset 2px 2px #5f594f,0 10px 30px #0008;opacity:0;transform:translateY(6px);transition:opacity .2s ease,transform .25s var(--out)}
#ctl.on{opacity:1;transform:none}
#ctl .row{display:flex;gap:4px;align-items:stretch}
#ctl .row.tl{align-items:center;gap:10px;padding:0 2px}
#ctl .gap{flex:1}
#ctl .time{flex:none;font:600 12px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--gold);letter-spacing:.06em;min-width:9ch;text-align:right}
#ctl .lcd{flex:1;min-height:30px;display:flex;align-items:center;justify-content:center;background:#2b2824;color:var(--gold);font:600 13px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.08em;padding:4px 10px;box-shadow:inset 1px 1px #191714,inset -1px -1px #7a7266,inset 2px 2px #2c2924,inset -2px -2px #5f594f}
input.w95{-webkit-appearance:none;appearance:none;flex:1;width:100%;height:24px;margin:0;background:transparent;cursor:pointer;--v:0%}
input.w95::-webkit-slider-runnable-track{height:6px;background:linear-gradient(90deg,var(--gold) var(--v),#2b2824 var(--v));box-shadow:inset 1px 1px #191714,inset -1px -1px #7a7266}
input.w95::-moz-range-track{height:6px;background:#2b2824;box-shadow:inset 1px 1px #191714,inset -1px -1px #7a7266;border:0}
input.w95::-moz-range-progress{height:6px;background:var(--gold)}
input.w95::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:22px;margin-top:-8px;background:#4d483f;border:0;border-radius:0;box-shadow:inset -1px -1px #191714,inset 1px 1px #7a7266,inset -2px -2px #2c2924,inset 2px 2px #5f594f}
input.w95::-moz-range-thumb{width:12px;height:22px;background:#4d483f;border:0;border-radius:0;box-shadow:inset -1px -1px #191714,inset 1px 1px #7a7266,inset -2px -2px #2c2924,inset 2px 2px #5f594f}
input.w95:focus-visible{outline:1px dotted var(--gold)}

#panel{position:absolute;top:0;right:0;height:100%;width:100%;background:var(--ink);border-left:3px solid var(--gold);box-shadow:-20px 0 60px #0009;transform:translateX(calc((1 - var(--p,0)) * (100% - var(--tab))));overflow:hidden;will-change:transform}
#panel.full{overflow-y:auto}
#panel .tab{position:absolute;left:0;top:0;width:var(--tab);height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:26px 0 22px;writing-mode:vertical-rl;opacity:calc(1 - var(--p,0)*1.4);cursor:pointer}
#panel .tab b{font-size:clamp(22px,2.6vw,34px);letter-spacing:.06em;color:var(--mint);line-height:1.15;text-transform:none}
#panel .tab span{color:var(--gold);font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
#panel .bd{margin-left:var(--tab);padding:9vh 4vw 14vh 3vw;max-width:1500px}
#panel .cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(28px,4vw,64px);align-items:start}
#panel .cols.pair{grid-template-columns:minmax(260px,.8fr) minmax(0,1.6fr);margin-top:12px}
#panel .txt{max-width:72ch}
#panel .txt>h3:first-child{margin-top:4px}
#panel .imgs .gal:first-child{margin-top:4px}
#panel .gal.stack{grid-template-columns:1fr;gap:14px;max-width:440px}
#panel .gal.grid2{grid-template-columns:repeat(2,minmax(0,1fr));max-width:480px}
#panel .gal.row3{grid-template-columns:repeat(3,minmax(0,1fr));max-width:720px}
#panel .gal img{aspect-ratio:auto;height:auto;object-fit:contain}
#panel .bd>.txt{margin-bottom:8px}
#panel .meta{color:var(--gold);letter-spacing:.14em;font-size:12px;text-transform:uppercase}
#panel h2{font-size:clamp(30px,4.6vw,56px);line-height:1.05;margin:8px 0 24px;color:var(--mint)}
#panel h3{font-size:clamp(16px,1.5vw,19px);color:var(--gold);letter-spacing:.12em;text-transform:uppercase;margin:32px 0 8px}
#panel p,#panel pre{margin:0 0 10px;white-space:pre-line;font:inherit}
#panel a.key{margin-top:10px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:24px 0}
.gal button{all:unset;cursor:zoom-in;display:block;border-radius:3px;overflow:hidden;background:#36322c;transition:transform .16s var(--out)}
.gal button:active{transform:scale(.97)}
.gal button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.gal img{width:100%;height:100%;display:block;object-fit:cover;aspect-ratio:var(--ar,4/3)}
.ph{aspect-ratio:4/3;display:grid;place-items:center;background:#36322c;color:var(--mu);font-size:11px;letter-spacing:.1em}
.nt{color:var(--mu)}

/* ---------- Lightbox ---------- */
#lb{position:fixed;inset:0;z-index:200;background:#1d1b18f0;display:grid;place-items:center;padding:56px 70px}
#lb img{max-width:100%;max-height:calc(100vh - 112px);max-height:calc(100dvh - 112px);display:block;box-shadow:0 20px 60px #000a;border-radius:2px;animation:lbIn .22s var(--out)}
@keyframes lbIn{from{opacity:0;transform:scale(.96)}}
#lb .key{position:fixed}
#lbX{top:14px;right:18px}
#lbP,#lbN{top:50%;transform:translateY(-50%);min-height:44px}
#lbP{left:14px}#lbN{right:14px}
#lbC{position:fixed;bottom:16px;left:0;right:0;text-align:center;color:var(--mu);font-size:12px;letter-spacing:.14em}

/* ---------- Über mich & Impressum ---------- */
.ov{position:fixed;inset:0;z-index:40;background:var(--ink);overflow-y:auto;padding:14vh 8vw 10vh}
.ov .in{max-width:110ch;margin:auto;display:grid;gap:44px}
.ov.ab .in{grid-template-columns:minmax(220px,1fr) 1.7fr;align-items:start}
.ov .close{position:fixed;left:max(18px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));z-index:5}
.photo{position:sticky;top:12vh;margin:0}
.photo .fr{position:relative}
.photo .fr>img{position:relative;z-index:1;width:100%;height:auto;display:block;filter:drop-shadow(0 18px 30px #0008);pointer-events:none}
.photo .slot{position:absolute;z-index:0;inset:var(--slot,4.1% 7.7% 4.4% 7.8%);display:grid;place-items:center;text-align:center;background:#d9d4c7;color:var(--ink);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.photo .slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame{aspect-ratio:3/4;border:16px solid #6b4426;box-shadow:inset 0 0 0 2px #0008,0 18px 40px #0009;background:#36322c;display:grid;place-items:center;color:var(--mu);font-size:11px;letter-spacing:.1em;text-align:center;padding:10px}
.ov h2{font-size:clamp(28px,4vw,48px);margin-bottom:16px}
.ov h3{font-size:clamp(15px,1.4vw,18px);color:var(--gold);letter-spacing:.12em;text-transform:uppercase;margin:28px 0 8px}
.ov p{margin:0 0 12px}.ov ul{margin:0 0 12px;padding-left:1.2em}
.ov a{color:var(--gold)}
.ov a.key{color:var(--mint)}
.ov .legal{max-width:80ch;margin:auto}
.legal h3{margin-top:30px}.legal h4{margin:18px 0 6px;font-size:15px;color:var(--teal);filter:brightness(1.35)}

#rot{position:fixed;inset:0;z-index:400;background:var(--ink);display:none;place-items:center;text-align:center;padding:30px}
#rot i{display:block;width:40px;margin:0 auto 18px;color:var(--mint);animation:rt 2.2s var(--io) infinite}
@keyframes rt{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media(orientation:portrait) and (max-width:900px){#rot{display:grid}}
@media(max-width:900px){#panel .cols,#panel .cols.pair{grid-template-columns:1fr}}
@media(max-width:760px){.ov.ab .in{grid-template-columns:1fr}.photo{position:static;max-width:320px}:root{--tab:5.5rem}#panel .tab b{font-size:20px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="rot"><div><i><svg viewBox="0 0 40 64" width="40" height="64" fill="none" stroke="currentColor" stroke-width="3"><rect x="3" y="3" width="34" height="58" rx="6"/><path d="M15 53h10"/></svg></i><p id="rotT">Bitte drehe dein Gerät ins Querformat.</p></div></div>
<header id="bar">
 <div><h1>Jeanette Birkemeyer</h1><small>▶ PORTFOLIO</small></div>
 <nav>
  <button class="key" id="bAbout" data-i="about">Über mich</button>
  <button class="key" id="bLang" aria-label="Sprache / Language">EN</button>
 </nav>
</header>
<main id="stage"><picture><source srcset="media/img/Homepage_Vintage_TVs.webp" type="image/webp"><img src="media/img/Homepage_Vintage_TVs.jpg" alt="Vintage-Fernseher und Poster an einer Betonwand" width="2092" height="1177" fetchpriority="high"></picture></main>
<div id="veil"></div>
<footer id="foot"><button id="bLegal" data-i="legal">Impressum &amp; Datenschutz</button><small data-i="credit">3D-Modell Fernbedienung: E. Puybaret / eTeks &amp; Scopia, CC BY 3.0</small></footer>
<section id="view" hidden role="dialog" aria-modal="true" aria-labelledby="pTitle">
 <button class="key" id="x">Menü</button>
 <div id="player"></div><div id="ctl"></div>
 <div class="sc" tabindex="-1"><div class="tr"><div class="st"><aside id="panel"></aside></div></div></div>
</section>
<section class="ov ab" id="about" hidden role="dialog" aria-modal="true"><button class="key close" data-close>Menü</button><div class="in"></div></section>
<section class="ov" id="legal" hidden role="dialog" aria-modal="true"><button class="key close" data-close>Menü</button><div class="in"></div></section>
<div id="lb" hidden role="dialog" aria-modal="true" aria-label="Bildansicht"><button class="key ic" id="lbX" aria-label="Schließen"></button><button class="key ic" id="lbP" aria-label="Vorheriges Bild"></button><img alt=""><button class="key ic" id="lbN" aria-label="Nächstes Bild"></button><div id="lbC"></div></div>
<div id="remote" aria-hidden="true"></div><div id="ir" aria-hidden="true"></div><div id="osd" aria-hidden="true"></div>
<script src="main.js"></script>
</body>
</html>
